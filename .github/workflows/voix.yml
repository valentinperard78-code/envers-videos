name: voix-off
on:
  push:
    branches: [voix]
    paths: ["texts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: voix
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q ffmpeg >/dev/null || true
      - run: pip install -q edge-tts
      - run: python tools/voix.py
      - run: |
          git config user.name "envers-bot"; git config user.email "bot@users.noreply.github.com"
          git add out && git commit -qm "Voix générées" && git push origin HEAD:voix
